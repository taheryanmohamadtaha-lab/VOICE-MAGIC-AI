name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  native-dsp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host-side DSP test
        run: |
          g++ -O2 -std=c++17 -Iandroid/audio-engine/src/main/cpp \
            android/audio-engine/src/test/cpp/dsp_test.cpp -o /tmp/dsp_test
          /tmp/dsp_test

  apk:
    runs-on: ubuntu-latest
    needs: [backend-tests, native-dsp-test]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :audio-engine:testDebugUnitTest :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMagicAI-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build only runs if you added the signing secrets (see docs/INSTALLATION_FA.md).
      - name: Check signing secrets
        id: signing
        env:
          KS: ${{ secrets.VMA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APK
        if: steps.signing.outputs.present == 'true'
        env:
          VMA_KEYSTORE_BASE64: ${{ secrets.VMA_KEYSTORE_BASE64 }}
          VMA_KEYSTORE_PASSWORD: ${{ secrets.VMA_KEYSTORE_PASSWORD }}
          VMA_KEY_ALIAS: ${{ secrets.VMA_KEY_ALIAS }}
          VMA_KEY_PASSWORD: ${{ secrets.VMA_KEY_PASSWORD }}
        run: |
          echo "$VMA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export VMA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMagicAI-release-apk
          path: android/app/build/outputs/apk/release/*.apk
